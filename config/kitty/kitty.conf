# Note: in kitty's mapping syntax, `alt` is the Option key on macOS, not cmd.
font_family       SauceCodePro Nerd Font
font_size         14.0
shell_integration enabled

# ported 1:1 from Ghostty's slower scroll feel (mouse-scroll-multiplier = 1)
wheel_scroll_multiplier 1.0

# Sonokai (default style) -- exact palette ported from Ghostty's bundled
# "Sonokai" theme, so both terminals look identical.
foreground             #e2e2e3
background             #2c2e34
selection_foreground   #e2e2e3
selection_background   #414550
cursor                 #e2e2e3
cursor_text_color      #2c2e34

color0  #181819
color8  #7f8490
color1  #fc5d7c
color9  #fc5d7c
color2  #9ed072
color10 #9ed072
color3  #e7c664
color11 #e7c664
color4  #76cce0
color12 #76cce0
color5  #b39df3
color13 #b39df3
color6  #f39660
color14 #f39660
color7  #e2e2e3
color15 #e2e2e3

# Tab bar: powerline style with angled dividers, colored with the same
# Sonokai accents as the rest of the theme.
tab_bar_style           powerline
tab_powerline_style     angled
active_tab_foreground   #2c2e34
active_tab_background   #76cce0
active_tab_font_style   bold
inactive_tab_foreground #7f8490
inactive_tab_background #2c2e34
inactive_tab_font_style normal

# Required for the smart-splits.nvim <-> kitty navigation integration below;
# the neighboring_window/relative_resize kittens talk to the running kitty
# instance over this socket, as does smart-splits.nvim itself.
allow_remote_control yes
listen_on unix:/tmp/kitty

# Splits and tabs, mirroring the tmux bindings this replaces. ctrl+a is
# the stand-in "prefix" -- and we use the > to compose multi-key bindings,
# but the letters match tmux 1:1: v/s for splits, c/n/p for windows (tabs).
# Numbered window select (tmux prefix+0-9) needs no mapping;
# kitty's own cmd+1..cmd+9 already does this.
enabled_layouts splits
map ctrl+a>v launch --location=vsplit --cwd=current
map ctrl+a>s launch --location=hsplit --cwd=current
map ctrl+a>c new_tab
map ctrl+a>n next_tab
map ctrl+a>p previous_tab
map ctrl+a>ctrl+a goto_tab 0
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

# r = reload config (kitty's default is ctrl+shift+F5; this is just easier
# to reach and keeps everything under one prefix)
map ctrl+a>r load_config_file

# Smart pane switching with awareness of Neovim splits (smart-splits.nvim).
# 'IS_NVIM' is a kitty user-var set by the plugin on load; the `--when-focus-on`
# lines below unmap the key while focus is on a Neovim pane so the keypress is
# forwarded to Neovim, which then does the actual navigation.
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

map alt+h kitten relative_resize.py left  1
map alt+j kitten relative_resize.py down  1
map alt+k kitten relative_resize.py up    1
map alt+l kitten relative_resize.py right 1

map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+l

# kitty-scrollback.nvim: browse scrollback with vim-style bindings, replacing
# tmux copy-mode-vi. ctrl+a>[ mirrors tmux's prefix+[ (enter copy-mode);
# ctrl+a>g mirrors the plugin's own default for jumping straight to the
# output of the last command.
action_alias kitty_scrollback_nvim kitten '/Users/mhinshaw/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
map ctrl+a>[ kitty_scrollback_nvim
map ctrl+a>g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
